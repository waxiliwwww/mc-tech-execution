<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="825" viewBox="0 0 1040 825" role="img" aria-labelledby="title desc"><title id="title">M1、M2、M3的计算与结果调用时序</title><desc id="desc">按图1相同模块分组：M1预览校核；M2保存快照并后台计算，返回编号后由用户查询；成功后M3从原始StatePoint读取所选统计，写图数据报告并返回服务端位置。</desc><rect width="1040" height="825" fill="#111820"/><style>text{font-family:system-ui,"Microsoft YaHei",sans-serif;fill:#e6edf4;font-size:16px}.small{fill:#acbdcd;font-size:14px}.head{font-weight:650;font-size:17px}.box{fill:#18232e;stroke:#536a80;stroke-width:1.4}.m1{fill:#142f32;stroke:#77d7c6}.m2{fill:#1b2a45;stroke:#8fb9ff}.m3{fill:#342b20;stroke:#efc67d}.aux{fill:#292139;stroke:#c2a7e8}.group{fill:#121d27;stroke:#77d7c6;stroke-width:1.3}.edge{fill:none;stroke:#77d7c6;stroke-width:1.6;marker-end:url(#arrow)}.return{stroke:#91a4b7;stroke-dasharray:5 4;marker-end:url(#return)}.lane{stroke:#536a80;stroke-dasharray:5 6;stroke-width:1}</style><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#77d7c6"/></marker><marker id="return" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#91a4b7"/></marker></defs><text class="head" x="75" y="36" text-anchor="middle">使用者 / 宿主</text><path class="lane" d="M75,55 V805"/><text class="head" x="255" y="36" text-anchor="middle">M1 模型准备</text><path class="lane" d="M255,55 V805"/><text class="head" x="445" y="36" text-anchor="middle">M2 作业与扫描</text><path class="lane" d="M445,55 V805"/><text class="head" x="640" y="36" text-anchor="middle">OpenMC环境</text><path class="lane" d="M640,55 V805"/><text class="head" x="830" y="36" text-anchor="middle">M3 结果分析</text><path class="lane" d="M830,55 V805"/><text class="head" x="980" y="36" text-anchor="middle">工作区</text><path class="lane" d="M980,55 V805"/><path class="edge" d="M75,100 H255"/><text class="small" x="165.0" y="92" text-anchor="middle">① 预览 / 校核case_dir</text><path class="edge" d="M255,140 H640"/><text class="small" x="447.5" y="132" text-anchor="middle">按需进入Python API解析</text><path class="edge return" d="M640,178 H255"/><text class="small" x="447.5" y="170" text-anchor="middle">解析结果与问题</text><path class="edge return" d="M255,211 H75"/><text class="small" x="165.0" y="203" text-anchor="middle">输入与校核结果</text><path class="edge" d="M75,260 H445"/><text class="small" x="260.0" y="252" text-anchor="middle">② 核对后提交（目录、名称、线程）</text><path class="edge" d="M445,295 H980"/><text class="small" x="712.5" y="287" text-anchor="middle">保存输入、配置快照与job记录</text><path class="edge" d="M445,325 H482 V350 H445"/><text class="small" x="535" y="342">启动后台worker</text><path class="edge return" d="M445,382 H75"/><text class="small" x="260.0" y="374" text-anchor="middle">立即返回job_id，不等待算完</text><path class="edge" d="M445,423 H640"/><text class="small" x="542.5" y="415" text-anchor="middle">后台：启动求解器</text><path class="edge" d="M640,460 H980"/><text class="small" x="810.0" y="452" text-anchor="middle">产生StatePoint等原始文件</text><path class="edge" d="M445,495 H980"/><text class="small" x="712.5" y="487" text-anchor="middle">记录日志、退出码和终态</text><path class="edge" d="M75,535 H445"/><text class="small" x="260.0" y="527" text-anchor="middle">③ 用同一job_id查询</text><path class="edge return" d="M445,570 H75"/><text class="small" x="260.0" y="562" text-anchor="middle">completed / failed / cancelled…</text><path class="edge" d="M75,615 H830"/><text class="small" x="452.5" y="607" text-anchor="middle">④ 成功后选择tally/score/nuclide/filter</text><path class="edge" d="M830,655 H640"/><text class="small" x="735.0" y="647" text-anchor="middle">经Python API读取原始统计</text><path class="edge return" d="M640,692 H830"/><text class="small" x="735.0" y="684" text-anchor="middle">均值、标准差、维度和来源</text><path class="edge" d="M830,735 H980"/><text class="small" x="905.0" y="727" text-anchor="middle">保存同一选择的图、CSV/JSON和报告</text><path class="edge return" d="M830,782 H75"/><text class="small" x="452.5" y="774" text-anchor="middle">返回结构化结果与服务端文件位置</text></svg>