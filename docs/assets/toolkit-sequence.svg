<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="755" viewBox="0 0 1040 755" role="img" aria-labelledby="title desc"><title id="title">提交计算与读取结果的调用时序</title><desc id="desc">接口先预览校核输入，提交时保存快照并启动独立作业工作进程，返回job_id。计算结束后查询同一编号，通过OpenMC Python API读取StatePoint并生成图报告，返回服务端位置。</desc><rect width="1040" height="755" fill="#111820"/><style>text{font-family:system-ui,"Microsoft YaHei",sans-serif;fill:#e6edf4;font-size:16px}.small{fill:#a9bacb;font-size:14px}.head{font-weight:650;font-size:17px}.box{fill:#18232e;stroke:#536a80;stroke-width:1.4}.a{fill:#142f32;stroke:#77d7c6}.b{fill:#1b2a45;stroke:#87abed}.c{fill:#342b20;stroke:#e9bd72}.edge{fill:none;stroke:#77d7c6;stroke-width:1.6;marker-end:url(#arrow)}.return{stroke:#91a4b7;stroke-dasharray:5 4;marker-end:url(#return)}.lane{stroke:#536a80;stroke-dasharray:5 6;stroke-width:1}.group{fill:#121d27;stroke:#344353;stroke-width:1.3}</style><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#77d7c6"/></marker><marker id="return" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#91a4b7"/></marker></defs><text class="head" x="85" y="36" text-anchor="middle">用户 / 宿主</text><path class="lane" d="M85,55 V735"/><text class="head" x="265" y="36" text-anchor="middle">接口与业务模块</text><path class="lane" d="M265,55 V735"/><text class="head" x="450" y="36" text-anchor="middle">OpenMC Python</text><path class="lane" d="M450,55 V735"/><text class="head" x="640" y="36" text-anchor="middle">作业工作进程</text><path class="lane" d="M640,55 V735"/><text class="head" x="825" y="36" text-anchor="middle">OpenMC 可执行</text><path class="lane" d="M825,55 V735"/><text class="head" x="975" y="36" text-anchor="middle">工作区</text><path class="lane" d="M975,55 V735"/><path class="edge" d="M85,100 H265"/><text class="small" x="175.0" y="92" text-anchor="middle">① case_dir：预览 / 校核</text><path class="edge" d="M265,140 H450"/><text class="small" x="357.5" y="132" text-anchor="middle">按需 API 解析</text><path class="edge return" d="M450,178 H265"/><text class="small" x="357.5" y="170" text-anchor="middle">检查结果与问题</text><path class="edge return" d="M265,212 H85"/><text class="small" x="175.0" y="204" text-anchor="middle">展示输入与校核结果</text><path class="edge" d="M85,255 H265"/><text class="small" x="175.0" y="247" text-anchor="middle">② 用户核对后提交</text><path class="edge" d="M265,285 H975"/><text class="small" x="620.0" y="277" text-anchor="middle">保存输入快照、配置与 job.json</text><path class="edge" d="M265,320 H640"/><text class="small" x="452.5" y="312" text-anchor="middle">启动自己的独立作业进程</text><path class="edge return" d="M265,350 H85"/><text class="small" x="175.0" y="342" text-anchor="middle">返回 job_id（尚未完成）</text><path class="edge" d="M640,390 H825"/><text class="small" x="732.5" y="382" text-anchor="middle">在快照目录启动求解器</text><path class="edge" d="M825,430 H975"/><text class="small" x="900.0" y="422" text-anchor="middle">写 StatePoint</text><path class="edge" d="M640,463 H975"/><text class="small" x="807.5" y="455" text-anchor="middle">保存日志、退出码与终态</text><path class="edge" d="M85,500 H265"/><text class="small" x="175.0" y="492" text-anchor="middle">③ 按同一 job_id 查询状态</text><path class="edge return" d="M265,533 H85"/><text class="small" x="175.0" y="525" text-anchor="middle">completed / failed / cancelled…</text><path class="edge" d="M85,577 H265"/><text class="small" x="175.0" y="569" text-anchor="middle">④ 选择计分，读结果 / 绘图 / 报告</text><path class="edge" d="M265,611 H450"/><text class="small" x="357.5" y="603" text-anchor="middle">通过 api() 进入计算环境</text><path class="edge" d="M450,646 H975"/><text class="small" x="712.5" y="638" text-anchor="middle">读原始 StatePoint，保存所选数据与产物</text><path class="edge return" d="M450,682 H265"/><text class="small" x="357" y="674" text-anchor="middle">结果与产物位置</text><path class="edge return" d="M265,725 H85"/><text class="small" x="175.0" y="717" text-anchor="middle">返回结果、来源与服务端路径</text></svg>