<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="650" viewBox="0 0 1040 650" role="img" aria-labelledby="title desc"><title id="title">三种输入汇入同一计算流程</title><desc id="desc">已有OpenMC程序先导出XML，新模型通过受控结构化描述生成XML；CAD先转换h5m并补材料、源与设置。三种输入都进入预览、校核和通用作业管理。</desc><rect width="1040" height="650" fill="#111820"/><style>text{font-family:system-ui,"Microsoft YaHei",sans-serif;fill:#e6edf4;font-size:16px}.small{fill:#a9bacb;font-size:14px}.head{font-weight:650;font-size:17px}.box{fill:#18232e;stroke:#536a80;stroke-width:1.4}.a{fill:#142f32;stroke:#77d7c6}.b{fill:#1b2a45;stroke:#87abed}.c{fill:#342b20;stroke:#e9bd72}.edge{fill:none;stroke:#77d7c6;stroke-width:1.6;marker-end:url(#arrow)}.return{stroke:#91a4b7;stroke-dasharray:5 4;marker-end:url(#return)}.lane{stroke:#536a80;stroke-dasharray:5 6;stroke-width:1}.group{fill:#121d27;stroke:#344353;stroke-width:1.3}</style><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#77d7c6"/></marker><marker id="return" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#91a4b7"/></marker></defs><rect class="box b" x="30" y="25" width="300" height="95" rx="9"/><text class="head" x="180.0" y="54" text-anchor="middle">已有 OpenMC 模型</text><text class="small" x="180.0" y="80" text-anchor="middle">可信 Python 程序先自行导出 XML</text><text class="small" x="180.0" y="103" text-anchor="middle">输入和依赖先放到服务端工作区</text><rect class="box b" x="370" y="25" width="300" height="95" rx="9"/><text class="head" x="520.0" y="54" text-anchor="middle">组合一个新模型</text><text class="small" x="520.0" y="80" text-anchor="middle">用户明确材料 / 几何 / 源 / 计分</text><text class="small" x="520.0" y="103" text-anchor="middle">宿主可把自然语言组织成 spec</text><rect class="box b" x="710" y="25" width="300" height="95" rx="9"/><text class="head" x="860.0" y="54" text-anchor="middle">CAD 的 STEP 模型</text><text class="small" x="860.0" y="80" text-anchor="middle">用户提供单位、实体材料映射</text><text class="small" x="860.0" y="103" text-anchor="middle">几何文件不自动包含物理设置</text><rect class="box " x="30" y="185" width="300" height="95" rx="9"/><text class="head" x="180.0" y="214" text-anchor="middle">导入与保存原生结构</text><text class="small" x="180.0" y="240" text-anchor="middle">openmc_import_model</text><text class="small" x="180.0" y="263" text-anchor="middle">XML 与依赖清单 / 新副本</text><rect class="box " x="370" y="185" width="300" height="95" rx="9"/><text class="head" x="520.0" y="214" text-anchor="middle">可信 Python API 建模</text><text class="small" x="520.0" y="240" text-anchor="middle">openmc_build_model</text><text class="small" x="520.0" y="263" text-anchor="middle">XML + model-spec.json + 源码</text><rect class="box c" x="710" y="185" width="300" height="95" rx="9"/><text class="head" x="860.0" y="214" text-anchor="middle">检查实体、生成网格</text><text class="small" x="860.0" y="240" text-anchor="middle">openmc_inspect_step</text><text class="small" x="860.0" y="263" text-anchor="middle">openmc_convert_cad → H5M</text><path class="edge" d="M180,120 V178"/><path class="edge" d="M520,120 V178"/><path class="edge" d="M860,120 V178"/><rect class="box c" x="710" y="325" width="300" height="95" rx="9"/><text class="head" x="860.0" y="354" text-anchor="middle">补齐 OpenMC 计算模型</text><text class="small" x="860.0" y="380" text-anchor="middle">openmc_build_dagmc_model</text><text class="small" x="860.0" y="403" text-anchor="middle">DAGMCUniverse + 材料/源 → XML</text><path class="edge" d="M860,280 V319"/><rect class="box a" x="30" y="455" width="980" height="65" rx="9"/><text class="head" x="520.0" y="484" text-anchor="middle">预览输入 → 校核 → 用户核对后命名提交</text><text class="small" x="520.0" y="510" text-anchor="middle">来源不同，作业管理与结果处理共用；工具不替用户猜材料和专业条件</text><path class="edge" d="M180,280 V449"/><path class="edge" d="M520,280 V449"/><path class="edge" d="M860,420 V449"/><rect class="box a" x="240" y="565" width="560" height="65" rx="9"/><text class="head" x="520.0" y="594" text-anchor="middle">OpenMC 求解 → StatePoint → 图 / 数据 / 报告</text><text class="small" x="520.0" y="620" text-anchor="middle">CSG 与 DAGMC 是两种几何路线，物理求解均由 OpenMC 完成</text><path class="edge" d="M520,520 V559"/></svg>