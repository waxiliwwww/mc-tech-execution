<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="755" viewBox="0 0 1040 755" role="img" aria-labelledby="title desc"><title id="title">图1 M1模型准备的内部流程</title><desc id="desc">本图只展开图1的M1，沿用同一名称与颜色。M1.1原生XML导入，M1.2结构化建模，M1.3 CAD从STEP转换到H5M再组装模型。三条支路统一到模型目录与校核结果，然后交给图1的M2。</desc><rect width="1040" height="755" fill="#111820"/><style>text{font-family:system-ui,"Microsoft YaHei",sans-serif;fill:#e6edf4;font-size:16px}.small{fill:#acbdcd;font-size:14px}.head{font-weight:650;font-size:17px}.box{fill:#18232e;stroke:#536a80;stroke-width:1.4}.m1{fill:#142f32;stroke:#77d7c6}.m2{fill:#1b2a45;stroke:#8fb9ff}.m3{fill:#342b20;stroke:#efc67d}.aux{fill:#292139;stroke:#c2a7e8}.group{fill:#121d27;stroke:#77d7c6;stroke-width:1.3}.edge{fill:none;stroke:#77d7c6;stroke-width:1.6;marker-end:url(#arrow)}.return{stroke:#91a4b7;stroke-dasharray:5 4;marker-end:url(#return)}.lane{stroke:#536a80;stroke-dasharray:5 6;stroke-width:1}</style><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#77d7c6"/></marker><marker id="return" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#91a4b7"/></marker></defs><rect class="group" x="20" y="20" width="1000" height="600" rx="12"/><text class="head" x="42" y="55">展开图1：M1 模型准备</text><rect class="box m1" x="40" y="90" width="280" height="95" rx="9"/><text class="head" x="180.0" y="119" text-anchor="middle">M1.1 已有模型</text><text class="small" x="180.0" y="147" text-anchor="middle">原生XML及声明的依赖</text><text class="small" x="180.0" y="172" text-anchor="middle">Python建模程序先导出XML</text><rect class="box m1" x="380" y="90" width="280" height="95" rx="9"/><text class="head" x="520.0" y="119" text-anchor="middle">M1.2 组合新模型</text><text class="small" x="520.0" y="147" text-anchor="middle">用户明确材料、几何、源和计分</text><text class="small" x="520.0" y="172" text-anchor="middle">结构化spec受已公开Schema约束</text><rect class="box m1" x="720" y="90" width="280" height="95" rx="9"/><text class="head" x="860.0" y="119" text-anchor="middle">M1.3 CAD输入适配</text><text class="small" x="860.0" y="147" text-anchor="middle">STEP几何 + 单位 + 材料映射</text><text class="small" x="860.0" y="172" text-anchor="middle">不是从几何自动推断物理条件</text><rect class="box " x="40" y="235" width="280" height="95" rx="9"/><text class="head" x="180.0" y="264" text-anchor="middle">导入原生输入</text><text class="small" x="180.0" y="292" text-anchor="middle">openmc_import_model</text><text class="small" x="180.0" y="317" text-anchor="middle">保留结构、登记依赖、创建副本</text><rect class="box " x="380" y="235" width="280" height="95" rx="9"/><text class="head" x="520.0" y="264" text-anchor="middle">调用可信Python API建模</text><text class="small" x="520.0" y="292" text-anchor="middle">openmc_build_model</text><text class="small" x="520.0" y="317" text-anchor="middle">XML + model-spec + 重建源码</text><rect class="box " x="720" y="235" width="280" height="95" rx="9"/><text class="head" x="860.0" y="264" text-anchor="middle">CAD实体检查与网格转换</text><text class="small" x="860.0" y="292" text-anchor="middle">CadQuery / cad_to_dagmc</text><text class="small" x="860.0" y="317" text-anchor="middle">STEP → dagmc.h5m</text><path class="edge" d="M180,185 V229"/><path class="edge" d="M520,185 V229"/><path class="edge" d="M860,185 V229"/><rect class="box " x="720" y="375" width="280" height="95" rx="9"/><text class="head" x="860.0" y="404" text-anchor="middle">组装OpenMC计算模型</text><text class="small" x="860.0" y="432" text-anchor="middle">DAGMCUniverse + 材料/源/设置</text><text class="small" x="860.0" y="457" text-anchor="middle">真空包围 → model.xml</text><path class="edge" d="M860,330 V369"/><rect class="box m1" x="40" y="525" width="960" height="70" rx="9"/><text class="head" x="520.0" y="554" text-anchor="middle">共同出口：可预览、可校核的模型目录</text><text class="small" x="520.0" y="582" text-anchor="middle">case_dir + XML/H5M等依赖 + 来源说明；可按发现的参数创建修改副本</text><path class="edge" d="M180,330 V519"/><path class="edge" d="M520,330 V519"/><path class="edge" d="M860,470 V519"/><rect class="box m2" x="340" y="680" width="360" height="65" rx="9"/><text class="head" x="520.0" y="709" text-anchor="middle">交给图1：M2 作业与扫描</text><text class="small" x="520.0" y="737" text-anchor="middle">固定输入快照，再启动实际计算</text><path class="edge" d="M520,595 V674"/><text class="small" x="520" y="653" text-anchor="middle">提交前由使用者核对输入与物理条件</text></svg>