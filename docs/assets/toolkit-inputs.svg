<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="880" viewBox="0 0 1040 880" role="img" aria-labelledby="title desc"><title id="title">M1模型准备：参数与输入生成</title><desc id="desc">三路输入分别为用户Python导出的XML、显式spec与模板、STEP转换与DAGMC组装。汇合后按发现范围创建参数副本，并交给同一M2。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#77d7c6"/></marker><marker id="future" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#efc67d"/></marker></defs><style>text{font-family:system-ui,"Microsoft YaHei",sans-serif;fill:#e6edf4}.head{font-size:18px;font-weight:650}.body{font-size:15px;fill:#b6c8da}.small{font-size:14px;fill:#b6c8da}.box{fill:#182630;stroke:#526e85;stroke-width:1.4}.m1{fill:#153032;stroke:#77d7c6}.m2{fill:#1c2a44;stroke:#8fb9ff}.m3{fill:#342c20;stroke:#efc67d}.plan{fill:#28251f;stroke:#efc67d;stroke-dasharray:7 5}.edge{fill:none;stroke:#77d7c6;stroke-width:1.7;marker-end:url(#arrow)}.planned{fill:none;stroke:#efc67d;stroke-width:1.7;stroke-dasharray:7 5;marker-end:url(#future)}.group{fill:#121f28;stroke:#344b5d;stroke-width:1.3}</style><rect width="1040" height="880" fill="#111820"/><text class="head" x="520" y="29" text-anchor="middle">M1：研究条件 → 显式参数 → 可执行模型输入</text><rect class="box " x="35" y="50" width="970" height="82" rx="9"/><text class="head" x="520.0" y="79" text-anchor="middle">参数依据</text><text class="body" x="520.0" y="108" text-anchor="middle">使用者给物理条件；宿主按Schema、模板或已有模型发现结果组织参数</text><rect class="box m1" x="35" y="180" width="290" height="114" rx="9"/><text class="head" x="180.0" y="209" text-anchor="middle">M1.1 已有模型</text><text class="body" x="180.0" y="238" text-anchor="middle">用户Python先自行导出XML</text><text class="body" x="180.0" y="263" text-anchor="middle">或直接提供原生XML与依赖</text><rect class="box m1" x="375" y="180" width="290" height="114" rx="9"/><text class="head" x="520.0" y="209" text-anchor="middle">M1.2 新建模型</text><text class="body" x="520.0" y="238" text-anchor="middle">显式spec / 已选模板</text><text class="body" x="520.0" y="263" text-anchor="middle">材料、几何、源、设置、计分</text><rect class="box m1" x="715" y="180" width="290" height="114" rx="9"/><text class="head" x="860.0" y="209" text-anchor="middle">M1.3 CAD几何</text><text class="body" x="860.0" y="238" text-anchor="middle">STEP + 长度单位/材料标签</text><text class="body" x="860.0" y="263" text-anchor="middle">另给材料配方、源与计算设置</text><path class="edge" d="M180,132 V174"/><path class="edge" d="M520,132 V174"/><path class="edge" d="M860,132 V174"/><rect class="box " x="35" y="340" width="290" height="112" rx="9"/><text class="head" x="180.0" y="369" text-anchor="middle">导入并登记依赖</text><text class="body" x="180.0" y="398" text-anchor="middle">import_model：创建新副本</text><text class="body" x="180.0" y="423" text-anchor="middle">保留原生结构及来源</text><rect class="box " x="375" y="340" width="290" height="112" rx="9"/><text class="head" x="520.0" y="369" text-anchor="middle">可信Python生成器</text><text class="body" x="520.0" y="398" text-anchor="middle">OpenMC对象 → 导出XML</text><text class="body" x="520.0" y="423" text-anchor="middle">spec路线另存spec与重建源码</text><rect class="box " x="715" y="340" width="290" height="112" rx="9"/><text class="head" x="860.0" y="369" text-anchor="middle">CAD检查与网格转换</text><text class="body" x="860.0" y="398" text-anchor="middle">CadQuery / cad_to_dagmc</text><text class="body" x="860.0" y="423" text-anchor="middle">STEP → dagmc.h5m</text><path class="edge" d="M180,294 V334"/><path class="edge" d="M520,294 V334"/><path class="edge" d="M860,294 V334"/><rect class="box " x="715" y="492" width="290" height="112" rx="9"/><text class="head" x="860.0" y="521" text-anchor="middle">DAGMC模型组装</text><text class="body" x="860.0" y="550" text-anchor="middle">H5M + 材料/源/统计设置</text><text class="body" x="860.0" y="575" text-anchor="middle">明确真空包围 → model.xml</text><path class="edge" d="M860,452 V486"/><rect class="box m1" x="35" y="650" width="970" height="82" rx="9"/><text class="head" x="520.0" y="679" text-anchor="middle">共同模型目录 case_dir</text><text class="body" x="520.0" y="708" text-anchor="middle">XML + 声明依赖 + 来源；预览/分层校核后按实际问题处理</text><path class="edge" d="M180,452 V644"/><path class="edge" d="M520,452 V644"/><path class="edge" d="M860,604 V644"/><rect class="box " x="80" y="770" width="420" height="80" rx="9"/><text class="head" x="290.0" y="799" text-anchor="middle">可选：创建参数副本</text><text class="body" x="290.0" y="828" text-anchor="middle">发现可改项 → 暂存修改 → 读回比对</text><rect class="box m2" x="650" y="770" width="355" height="80" rx="9"/><text class="head" x="827.5" y="799" text-anchor="middle">交给M2：命名提交</text><text class="body" x="827.5" y="828" text-anchor="middle">计算前定义要统计的tally</text><path class="edge" d="M290,732 V764"/><path class="edge" d="M500,810 H644"/><path class="edge" d="M830,732 V764"/></svg>
