<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="1040" viewBox="0 0 1040 1040" role="img" aria-labelledby="title desc"><title id="title">M1模型准备：用户输入、宿主参数与包内Python</title><desc id="desc">用户提供自然语言或支持的文件；自然语言宿主整理参数，已有参数和文件也可直接调用。包内Python按参数生成、原生XML导入或CAD适配形成模型目录，由调用方交给M2。已有Python脚本不在主线。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#77d7c6"/></marker><marker id="future" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#efc67d"/></marker></defs><style>text{font-family:system-ui,"Microsoft YaHei",sans-serif;fill:#e6edf4}.head{font-size:18px;font-weight:650}.body{font-size:15px;fill:#b6c8da}.small{font-size:14px;fill:#b6c8da}.box{fill:#182630;stroke:#526e85;stroke-width:1.4}.m1{fill:#153032;stroke:#77d7c6}.m2{fill:#1c2a44;stroke:#8fb9ff}.m3{fill:#342c20;stroke:#efc67d}.plan{fill:#28251f;stroke:#efc67d;stroke-dasharray:7 5}.edge{fill:none;stroke:#77d7c6;stroke-width:1.7;marker-end:url(#arrow)}.planned{fill:none;stroke:#efc67d;stroke-width:1.7;stroke-dasharray:7 5;marker-end:url(#future)}.group{fill:#121f28;stroke:#344b5d;stroke-width:1.3}</style><rect width="1040" height="1040" fill="#111820"/><rect class="box " x="35" y="20" width="450" height="82" rx="9"/><text class="head" x="260.0" y="49" text-anchor="middle">用户：自然语言需求</text><text class="body" x="260.0" y="78" text-anchor="middle">研究目的 + 已知物理条件 / 参考资料</text><rect class="box " x="555" y="20" width="450" height="82" rx="9"/><text class="head" x="780.0" y="49" text-anchor="middle">用户：支持的文件</text><text class="body" x="780.0" y="78" text-anchor="middle">model-spec JSON / 原生XML及依赖 / STEP</text><rect class="box " x="35" y="145" width="450" height="110" rx="9"/><text class="head" x="260.0" y="174" text-anchor="middle">自然语言宿主（DSH等）</text><text class="body" x="260.0" y="203" text-anchor="middle">读取Schema、已有信息与用户物理条件</text><text class="body" x="260.0" y="228" text-anchor="middle">组织明确参数、选择工具；缺项补齐</text><rect class="box " x="555" y="145" width="450" height="110" rx="9"/><text class="head" x="780.0" y="174" text-anchor="middle">文件或直接参数调用</text><text class="body" x="780.0" y="203" text-anchor="middle">JSON读取为spec；XML/STEP按路径接入</text><text class="body" x="780.0" y="228" text-anchor="middle">CLI可直接调用同一接口，无需大模型</text><path class="edge" d="M260,102 V139"/><path class="edge" d="M780,102 V139"/><path d="M260,255 V278 M780,255 V278 M180,278 H860" fill="none" stroke="#77d7c6" stroke-width="1.7"/><rect class="group" x="20" y="305" width="1000" height="650" rx="12"/><text class="small" x="42" y="331" text-anchor="start">工具包内</text><path class="edge" d="M180,278 V344"/><path class="edge" d="M520,278 V344"/><path class="edge" d="M860,278 V344"/><rect class="box m1" x="35" y="350" width="290" height="112" rx="9"/><text class="head" x="180.0" y="379" text-anchor="middle">M1.1 原生XML接入</text><text class="body" x="180.0" y="408" text-anchor="middle">XML + 声明依赖</text><text class="body" x="180.0" y="433" text-anchor="middle">包内复制、检查并默认API解析</text><rect class="box m1" x="375" y="350" width="290" height="112" rx="9"/><text class="head" x="520.0" y="379" text-anchor="middle">M1.2 参数生成</text><text class="body" x="520.0" y="408" text-anchor="middle">spec / 已选模板中的明确参数</text><text class="body" x="520.0" y="433" text-anchor="middle">包内Python → OpenMC对象 → XML</text><rect class="box m1" x="715" y="350" width="290" height="112" rx="9"/><text class="head" x="860.0" y="379" text-anchor="middle">M1.3 CAD文件适配</text><text class="body" x="860.0" y="408" text-anchor="middle">STEP + 单位 / 材料标签</text><text class="body" x="860.0" y="433" text-anchor="middle">CadQuery/cad_to_dagmc → H5M</text><rect class="box " x="715" y="510" width="290" height="112" rx="9"/><text class="head" x="860.0" y="539" text-anchor="middle">DAGMC模型组装</text><text class="body" x="860.0" y="568" text-anchor="middle">材料配方 / 源 / 设置 / 明确边界</text><text class="body" x="860.0" y="593" text-anchor="middle">包内Python → model.xml</text><path class="edge" d="M860,462 V504"/><rect class="box m1" x="35" y="675" width="970" height="82" rx="9"/><text class="head" x="520.0" y="704" text-anchor="middle">共同模型目录 case_dir</text><text class="body" x="520.0" y="733" text-anchor="middle">模型XML + 依赖 + 来源；预览、分层校核后处理发现的问题</text><path class="edge" d="M180,462 V669"/><path class="edge" d="M520,462 V669"/><path class="edge" d="M860,622 V669"/><rect class="box " x="40" y="815" width="440" height="85" rx="9"/><text class="head" x="260.0" y="844" text-anchor="middle">可选：创建参数副本</text><text class="body" x="260.0" y="873" text-anchor="middle">发现可改项 → 暂存修改 → 读回比对</text><rect class="box m2" x="580" y="815" width="425" height="85" rx="9"/><text class="head" x="792.5" y="844" text-anchor="middle">M2 作业管理：调用方发起提交</text><text class="body" x="792.5" y="873" text-anchor="middle">传入case_dir、任务名、线程数</text><path class="edge" d="M260,757 V809"/><path class="edge" d="M480,857 H574"/><path class="edge" d="M792.5,757 V809"/><text class="small" x="520" y="936" text-anchor="middle">计分在计算前定义；输入生成成功与实际求解分开</text><text class="small" x="520" y="1006" text-anchor="middle">原生XML/STEP路径指服务端工作区；MCP传路径不会自动上传文件</text></svg>
