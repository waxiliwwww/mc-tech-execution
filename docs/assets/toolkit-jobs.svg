<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="1030" viewBox="0 0 1040 1030" role="img" aria-labelledby="title desc"><title id="title">M2作业管理：本地实现与HPC设计</title><desc id="desc">先复制输入和固化作业记录。本地由独立worker驱动OpenMC。HPC是未实现方案，需传输、提交收据、状态对账、产物取回校验后才能进入M3。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#77d7c6"/></marker><marker id="future" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#efc67d"/></marker></defs><style>text{font-family:system-ui,"Microsoft YaHei",sans-serif;fill:#e6edf4}.head{font-size:18px;font-weight:650}.body{font-size:15px;fill:#b6c8da}.small{font-size:14px;fill:#b6c8da}.box{fill:#182630;stroke:#526e85;stroke-width:1.4}.m1{fill:#153032;stroke:#77d7c6}.m2{fill:#1c2a44;stroke:#8fb9ff}.m3{fill:#342c20;stroke:#efc67d}.plan{fill:#28251f;stroke:#efc67d;stroke-dasharray:7 5}.edge{fill:none;stroke:#77d7c6;stroke-width:1.7;marker-end:url(#arrow)}.planned{fill:none;stroke:#efc67d;stroke-width:1.7;stroke-dasharray:7 5;marker-end:url(#future)}.group{fill:#121f28;stroke:#344b5d;stroke-width:1.3}</style><rect width="1040" height="1030" fill="#111820"/><text class="head" x="520" y="28" text-anchor="middle">M2：自有Linux服务器上的提交、监控与结果交接</text><rect class="box m2" x="185" y="47" width="670" height="82" rx="9"/><text class="head" x="520.0" y="76" text-anchor="middle">M1目录 → 提交副本与作业记录</text><text class="body" x="520.0" y="105" text-anchor="middle">work/输入副本与指纹 / name与job_id / runtime配置</text><rect class="group" x="20" y="175" width="485" height="650" rx="9"/><rect class="box plan" x="535" y="175" width="485" height="650" rx="9"/><text class="head" x="263" y="206" text-anchor="middle">自有Linux服务器 · 本地实现</text><text class="head" x="778" y="206" text-anchor="middle">HPC/Slurm后端 · 设计，未实现</text><rect class="box " x="45" y="240" width="435" height="92" rx="9"/><text class="head" x="262.5" y="269" text-anchor="middle">独立后台监控进程</text><text class="body" x="262.5" y="298" text-anchor="middle">请求返回job_id，不等待求解结束</text><path class="edge" d="M262.5,332 V376"/><rect class="box " x="45" y="382" width="435" height="92" rx="9"/><text class="head" x="262.5" y="411" text-anchor="middle">OpenMC计算进程</text><text class="body" x="262.5" y="440" text-anchor="middle">在work/运行；输出保存到solver.log</text><path class="edge" d="M262.5,474 V518"/><rect class="box " x="45" y="524" width="435" height="92" rx="9"/><text class="head" x="262.5" y="553" text-anchor="middle">状态查询与取消</text><text class="body" x="262.5" y="582" text-anchor="middle">job.json记录状态；查询时解析日志</text><text class="small" x="262.5" y="606" text-anchor="middle">cancel_requested后继续确认终态</text><path class="edge" d="M262.5,616 V660"/><rect class="box " x="45" y="666" width="435" height="92" rx="9"/><text class="head" x="262.5" y="695" text-anchor="middle">结束后记录原始产物</text><text class="body" x="262.5" y="724" text-anchor="middle">归属进程结束后记录文件与指纹</text><path class="edge" d="M520,129 V151 H262.5 V169"/><rect class="box plan" x="560" y="240" width="435" height="92" rx="9"/><text class="head" x="777.5" y="269" text-anchor="middle">集群连接与输入准备</text><text class="body" x="777.5" y="298" text-anchor="middle">鉴权 / 独立远端目录 / 依赖路径映射</text><path class="planned" d="M777.5,332 V376"/><rect class="box plan" x="560" y="382" width="435" height="92" rx="9"/><text class="head" x="777.5" y="411" text-anchor="middle">提交并保存调度收据</text><text class="body" x="777.5" y="440" text-anchor="middle">sbatch → 本包job_id ↔ 集群job_id</text><path class="planned" d="M777.5,474 V518"/><rect class="box plan" x="560" y="524" width="435" height="92" rx="9"/><text class="head" x="777.5" y="553" text-anchor="middle">跟踪与取消</text><text class="body" x="777.5" y="582" text-anchor="middle">squeue/sacct对账；scancel请求取消</text><path class="planned" d="M777.5,616 V660"/><rect class="box plan" x="560" y="666" width="435" height="92" rx="9"/><text class="head" x="777.5" y="695" text-anchor="middle">远端终态与结果取回</text><text class="body" x="777.5" y="724" text-anchor="middle">核对退出结果 → 传回文件 → 指纹核验</text><path class="planned" d="M520,129 V151 H777.5 V169"/><text class="small" x="263" y="802" text-anchor="middle">服务器 .mc-jobs/&lt;job_id&gt;/ 保存记录</text><text class="small" x="778" y="802" text-anchor="middle">完成计算 ≠ 已取回可读取结果</text><rect class="box m3" x="185" y="881" width="670" height="82" rx="9"/><text class="head" x="520.0" y="910" text-anchor="middle">结果交接：成功终态 + 对应文件与来源</text><text class="body" x="520.0" y="939" text-anchor="middle">StatePoint核验后读取；燃耗走专用检查</text><path class="edge" d="M262.5,825 V858 H390 V875"/><path class="planned" d="M777.5,825 V858 H650 V875"/><text class="small" x="520" y="1002" text-anchor="middle">实线：当前服务器本地实现；虚线：HPC待开发，不是已有配置选项</text><path class="edge" d="M262.5,220 V234"/><path class="planned" d="M777.5,220 V234"/></svg>
