<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="810" viewBox="0 0 1040 810" role="img" aria-labelledby="title desc"><title id="title">M3结果分析：原生统计到整理产物</title><desc id="desc">本包成功作业与核验的原始结果分别进入通用所选曲线及报告、网格热图、燃耗专用读取。网格热图没有自动进入通用所选报告。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#77d7c6"/></marker><marker id="future" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#efc67d"/></marker></defs><style>text{font-family:system-ui,"Microsoft YaHei",sans-serif;fill:#e6edf4}.head{font-size:18px;font-weight:650}.body{font-size:15px;fill:#b6c8da}.small{font-size:14px;fill:#b6c8da}.box{fill:#182630;stroke:#526e85;stroke-width:1.4}.m1{fill:#153032;stroke:#77d7c6}.m2{fill:#1c2a44;stroke:#8fb9ff}.m3{fill:#342c20;stroke:#efc67d}.plan{fill:#28251f;stroke:#efc67d;stroke-dasharray:7 5}.edge{fill:none;stroke:#77d7c6;stroke-width:1.7;marker-end:url(#arrow)}.planned{fill:none;stroke:#efc67d;stroke-width:1.7;stroke-dasharray:7 5;marker-end:url(#future)}.group{fill:#121f28;stroke:#344b5d;stroke-width:1.3}</style><rect width="1040" height="810" fill="#111820"/><rect class="box m3" x="150" y="22" width="740" height="84" rx="9"/><text class="head" x="520.0" y="51" text-anchor="middle">M3接收本包作业结果</text><text class="body" x="520.0" y="80" text-anchor="middle">确认作业终态与结果类型；按对应接口读取</text><rect class="box " x="30" y="150" width="645" height="84" rx="9"/><text class="head" x="352.5" y="179" text-anchor="middle">StatePoint：keff / tally / score / nuclide / filter</text><text class="body" x="352.5" y="208" text-anchor="middle">StatePoint分支核验SHA256；预览不代替全量</text><rect class="box " x="715" y="150" width="295" height="84" rx="9"/><text class="head" x="862.5" y="179" text-anchor="middle">燃耗专用读取</text><text class="body" x="862.5" y="208" text-anchor="middle">depletion_results.h5</text><path class="edge" d="M430,106 V126 H352.5 V144"/><path class="edge" d="M670,106 V126 H862.5 V144"/><rect class="box " x="30" y="289" width="300" height="112" rx="9"/><text class="head" x="180.0" y="318" text-anchor="middle">通用所选series</text><text class="body" x="180.0" y="347" text-anchor="middle">所选值、误差与分箱坐标</text><text class="body" x="180.0" y="372" text-anchor="middle">调用方应明确选择条件</text><rect class="box " x="375" y="289" width="300" height="112" rx="9"/><text class="head" x="525.0" y="318" text-anchor="middle">规则网格切片</text><text class="body" x="525.0" y="347" text-anchor="middle">计分值 + 提交模型中的网格</text><text class="body" x="525.0" y="372" text-anchor="middle">按需指定层与能量箱</text><rect class="box " x="715" y="289" width="295" height="112" rx="9"/><text class="head" x="862.5" y="318" text-anchor="middle">时间与关键核素</text><text class="body" x="862.5" y="347" text-anchor="middle">时间 / keff / 受支持质量项</text><text class="body" x="862.5" y="372" text-anchor="middle">依赖链与材料信息</text><path class="edge" d="M352.5,234 V258 H180 V283"/><path class="edge" d="M352.5,234 V258 H525 V283"/><path class="edge" d="M862.5,234 V283"/><rect class="box " x="30" y="462" width="300" height="87" rx="9"/><text class="head" x="180.0" y="491" text-anchor="middle">曲线 + 完整CSV/JSON</text><text class="body" x="180.0" y="520" text-anchor="middle">同次生成；保留所选统计</text><rect class="box " x="375" y="462" width="300" height="87" rx="9"/><text class="head" x="525.0" y="491" text-anchor="middle">热图 + values CSV/JSON</text><text class="body" x="525.0" y="520" text-anchor="middle">独立产物；保留空间坐标</text><rect class="box " x="715" y="462" width="295" height="87" rx="9"/><text class="head" x="862.5" y="491" text-anchor="middle">结构化燃耗结果</text><text class="body" x="862.5" y="520" text-anchor="middle">专用结果，不泛解任意HDF5</text><path class="edge" d="M180,401 V456"/><path class="edge" d="M525,401 V456"/><path class="edge" d="M862.5,401 V456"/><rect class="box m3" x="30" y="610" width="450" height="112" rx="9"/><text class="head" x="255.0" y="639" text-anchor="middle">通用所选报告</text><text class="body" x="255.0" y="668" text-anchor="middle">读取同张曲线的series JSON</text><text class="body" x="255.0" y="693" text-anchor="middle">共享所选数据与提交元数据</text><path class="edge" d="M180,549 V604"/><text class="body" x="720" y="654" text-anchor="middle">网格热图目前不自动并入此报告</text><text class="body" x="720" y="683" text-anchor="middle">所有产物仍存服务端工作区</text><text class="small" x="520" y="778" text-anchor="middle">值/误差/坐标/来源一起交接；统计与归一化条件不由绘图自动补齐</text></svg>
