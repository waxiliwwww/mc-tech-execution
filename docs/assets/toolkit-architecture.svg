<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="805" viewBox="0 0 1040 805" role="img" aria-labelledby="title desc"><title id="title">工具包分层架构与工作过程</title><desc id="desc">直接CLI或MCP宿主使用同一接口，核心为M1模型准备、M2作业与扫描、M3结果分析与报告。CAD是M1内部的M1.3支路，图2专门展开M1。工作区和运行环境是共享支撑，资料检索和诊断辅助主流程。</desc><rect width="1040" height="805" fill="#111820"/><style>text{font-family:system-ui,"Microsoft YaHei",sans-serif;fill:#e6edf4;font-size:16px}.small{fill:#acbdcd;font-size:14px}.head{font-weight:650;font-size:17px}.box{fill:#18232e;stroke:#536a80;stroke-width:1.4}.m1{fill:#142f32;stroke:#77d7c6}.m2{fill:#1b2a45;stroke:#8fb9ff}.m3{fill:#342b20;stroke:#efc67d}.aux{fill:#292139;stroke:#c2a7e8}.group{fill:#121d27;stroke:#77d7c6;stroke-width:1.3}.edge{fill:none;stroke:#77d7c6;stroke-width:1.6;marker-end:url(#arrow)}.return{stroke:#91a4b7;stroke-dasharray:5 4;marker-end:url(#return)}.lane{stroke:#536a80;stroke-dasharray:5 6;stroke-width:1}</style><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#77d7c6"/></marker><marker id="return" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#91a4b7"/></marker></defs><rect class="box " x="30" y="20" width="450" height="100" rx="9"/><text class="head" x="255.0" y="49" text-anchor="middle">直接CLI</text><text class="small" x="255.0" y="77" text-anchor="middle">用工具名与JSON参数调用</text><text class="small" x="255.0" y="102" text-anchor="middle">不需要大模型</text><rect class="box " x="560" y="20" width="450" height="100" rx="9"/><text class="head" x="785.0" y="49" text-anchor="middle">MCP宿主（DSH等）</text><text class="small" x="785.0" y="77" text-anchor="middle">组织参数、组合操作、呈现结果</text><text class="small" x="785.0" y="102" text-anchor="middle">自然语言编排由宿主承担</text><rect class="box " x="240" y="145" width="560" height="70" rx="9"/><text class="head" x="520.0" y="174" text-anchor="middle">同一套接口与参数校验</text><text class="small" x="520.0" y="202" text-anchor="middle">各模块都可调用；按任务需要组合操作</text><path class="edge" d="M255,120 V139"/><path class="edge" d="M785,120 V139"/><path class="edge" d="M520,215 V230 H170 V254"/><path class="edge" d="M520,215 V230 H520 V254"/><path class="edge" d="M520,215 V230 H870 V254"/><rect class="box m1" x="30" y="260" width="280" height="220" rx="9"/><text class="head" x="170.0" y="289" text-anchor="middle">M1 模型准备</text><text class="small" x="170.0" y="317" text-anchor="middle">接入 / 生成 / 创建参数副本</text><text class="small" x="170.0" y="342" text-anchor="middle">预览输入、依赖与校核问题</text><text class="small" x="170.0" y="367" text-anchor="middle">包含 M1.3：CAD输入适配</text><text class="small" x="170.0" y="392" text-anchor="middle">交出：case_dir 与可检查输入</text><text class="small" x="170.0" y="417" text-anchor="middle">内部流程见图2</text><rect class="box m2" x="380" y="260" width="280" height="220" rx="9"/><text class="head" x="520.0" y="289" text-anchor="middle">M2 作业与扫描</text><text class="small" x="520.0" y="317" text-anchor="middle">固定提交快照，命名与分配ID</text><text class="small" x="520.0" y="342" text-anchor="middle">后台启动OpenMC真实计算</text><text class="small" x="520.0" y="367" text-anchor="middle">查询进度、失败日志与取消</text><text class="small" x="520.0" y="392" text-anchor="middle">参数组合各自形成独立作业</text><text class="small" x="520.0" y="417" text-anchor="middle">交出：状态与原始计算文件</text><rect class="box m3" x="730" y="260" width="280" height="220" rx="9"/><text class="head" x="870.0" y="289" text-anchor="middle">M3 结果分析与报告</text><text class="small" x="870.0" y="317" text-anchor="middle">选择tally、核素和过滤箱</text><text class="small" x="870.0" y="342" text-anchor="middle">读取均值、标准差和坐标</text><text class="small" x="870.0" y="367" text-anchor="middle">生成图与完整所选CSV/JSON</text><text class="small" x="870.0" y="392" text-anchor="middle">报告沿用同一结果选择</text><text class="small" x="870.0" y="417" text-anchor="middle">交出：数据、文件路径与来源</text><path class="edge" d="M310,350 H374"/><text class="small" x="345" y="333" text-anchor="middle">模型目录</text><path class="edge" d="M660,350 H724"/><text class="small" x="695" y="330" text-anchor="middle">成功作业</text><text class="small" x="695" y="375" text-anchor="middle">+ 原始结果</text><rect class="box " x="30" y="535" width="980" height="76" rx="9"/><text class="head" x="520.0" y="564" text-anchor="middle">共享工作区 workspace</text><text class="small" x="520.0" y="592" text-anchor="middle">原模型与副本 · job/scan记录 · 输入快照 · 运行配置 · StatePoint · 图、数据和报告</text><path class="edge" d="M170,480 V529"/><path class="edge" d="M520,480 V529"/><path class="edge" d="M870,480 V529"/><text class="small" x="30" y="640">运行依赖：由上方模块按操作调用，不是额外的数据处理阶段</text><rect class="box " x="30" y="655" width="650" height="125" rx="9"/><text class="head" x="355.0" y="684" text-anchor="middle">实际计算与转换环境</text><text class="small" x="355.0" y="712" text-anchor="middle">M1/M3：OpenMC Python API、HDF5读取与绘图</text><text class="small" x="355.0" y="737" text-anchor="middle">M2：OpenMC可执行程序；M1.3：CAD转换环境</text><text class="small" x="355.0" y="762" text-anchor="middle">M3：DOCX生成及按需Office格式转换</text><rect class="box aux" x="710" y="655" width="300" height="125" rx="9"/><text class="head" x="860.0" y="684" text-anchor="middle">资料检索与诊断（辅助）</text><text class="small" x="860.0" y="712" text-anchor="middle">给M1/M2提供原文或错误证据</text><text class="small" x="860.0" y="737" text-anchor="middle">有限修复先预览、确认再校核</text><text class="small" x="860.0" y="762" text-anchor="middle">不是独立的物理求解器</text></svg>