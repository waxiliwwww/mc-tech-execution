<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="560" viewBox="0 0 1040 560" role="img" aria-labelledby="title desc"><title id="title">MC工具包总体架构</title><desc id="desc">CLI和MCP共用接口，M1准备模型，M2执行作业，M3整理结果；共享服务端工作区并调用独立科学运行环境。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#77d7c6"/></marker><marker id="future" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#efc67d"/></marker></defs><style>text{font-family:system-ui,"Microsoft YaHei",sans-serif;fill:#e6edf4}.head{font-size:18px;font-weight:650}.body{font-size:15px;fill:#b6c8da}.small{font-size:14px;fill:#b6c8da}.box{fill:#182630;stroke:#526e85;stroke-width:1.4}.m1{fill:#153032;stroke:#77d7c6}.m2{fill:#1c2a44;stroke:#8fb9ff}.m3{fill:#342c20;stroke:#efc67d}.plan{fill:#28251f;stroke:#efc67d;stroke-dasharray:7 5}.edge{fill:none;stroke:#77d7c6;stroke-width:1.7;marker-end:url(#arrow)}.planned{fill:none;stroke:#efc67d;stroke-width:1.7;stroke-dasharray:7 5;marker-end:url(#future)}.group{fill:#121f28;stroke:#344b5d;stroke-width:1.3}</style><rect width="1040" height="560" fill="#111820"/><rect class="box " x="300" y="15" width="440" height="80" rx="9"/><text class="head" x="520.0" y="44" text-anchor="middle">CLI / MCP宿主</text><text class="body" x="520.0" y="73" text-anchor="middle">调用工具；自然语言编排在宿主侧</text><rect class="group" x="15" y="120" width="1010" height="370" rx="9"/><text class="small" x="32" y="144" text-anchor="start">MC工具包：接口、领域操作与作业记录</text><rect class="box " x="310" y="160" width="420" height="80" rx="9"/><text class="head" x="520.0" y="189" text-anchor="middle">共用接口与参数契约</text><text class="body" x="520.0" y="218" text-anchor="middle">注册表 / Schema / 工作区路径检查</text><path class="edge" d="M520,95 V154"/><rect class="box m1" x="30" y="285" width="280" height="82" rx="9"/><text class="head" x="170.0" y="314" text-anchor="middle">M1 模型准备</text><text class="body" x="170.0" y="343" text-anchor="middle">把模型与参数变成计算输入</text><rect class="box m2" x="380" y="285" width="280" height="82" rx="9"/><text class="head" x="520.0" y="314" text-anchor="middle">M2 作业管理</text><text class="body" x="520.0" y="343" text-anchor="middle">保存提交、执行与追踪终态</text><rect class="box m3" x="730" y="285" width="280" height="82" rx="9"/><text class="head" x="870.0" y="314" text-anchor="middle">M3 结果分析</text><text class="body" x="870.0" y="343" text-anchor="middle">提取统计、生成图与报告</text><path class="edge" d="M520,240 V258 H170 V279"/><path class="edge" d="M520,240 V279"/><path class="edge" d="M520,240 V258 H870 V279"/><path class="edge" d="M310,326 H374"/><path class="edge" d="M660,326 H724"/><text class="small" x="345" y="311" text-anchor="middle">模型目录</text><text class="small" x="695" y="311" text-anchor="middle">作业结果</text><rect class="box " x="30" y="401" width="980" height="77" rx="9"/><text class="head" x="520.0" y="430" text-anchor="middle">共享工作区</text><text class="body" x="520.0" y="459" text-anchor="middle">输入 / 提交副本 / job与scan记录 / 原始输出 / 整理产物</text><path class="edge" d="M170,367 V395"/><path class="edge" d="M520,367 V395"/><path class="edge" d="M870,367 V395"/><text class="small" x="520" y="511" text-anchor="middle">运行依赖：OpenMC Python API与求解器 · CAD转换环境 · 核数据 · 绘图与Office</text><text class="small" x="520" y="541" text-anchor="middle">知识检索、诊断与确认修复、存储管理为横向支撑；HPC后端尚未实现</text></svg>
