<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="690" viewBox="0 0 1040 690" role="img" aria-labelledby="title desc"><title id="title">MC工具包分层架构</title><desc id="desc">宿主和CLI进入同一注册表及校验。业务模块通过短时Python API进程或独立作业进程调用OpenMC，CAD与Office使用可选独立环境，数据留在服务端工作区。</desc><rect width="1040" height="690" fill="#111820"/><style>text{font-family:system-ui,"Microsoft YaHei",sans-serif;fill:#e6edf4;font-size:16px}.small{fill:#a9bacb;font-size:14px}.head{font-weight:650;font-size:17px}.box{fill:#18232e;stroke:#536a80;stroke-width:1.4}.a{fill:#142f32;stroke:#77d7c6}.b{fill:#1b2a45;stroke:#87abed}.c{fill:#342b20;stroke:#e9bd72}.edge{fill:none;stroke:#77d7c6;stroke-width:1.6;marker-end:url(#arrow)}.return{stroke:#91a4b7;stroke-dasharray:5 4;marker-end:url(#return)}.lane{stroke:#536a80;stroke-dasharray:5 6;stroke-width:1}.group{fill:#121d27;stroke:#344353;stroke-width:1.3}</style><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#77d7c6"/></marker><marker id="return" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#91a4b7"/></marker></defs><rect class="box b" x="30" y="20" width="465" height="84" rx="9"/><text class="head" x="262.5" y="49" text-anchor="middle">DSH / Helix 等宿主</text><text class="small" x="262.5" y="75" text-anchor="middle">理解自然语言、组织参数、呈现结果</text><text class="small" x="262.5" y="98" text-anchor="middle">宿主与模型在工具包之外</text><rect class="box b" x="545" y="20" width="465" height="84" rx="9"/><text class="head" x="777.5" y="49" text-anchor="middle">直接终端 CLI</text><text class="small" x="777.5" y="75" text-anchor="middle">./mc.sh call 工具名 JSON参数</text><text class="small" x="777.5" y="98" text-anchor="middle">不需要宿主和大模型</text><rect class="group" x="20" y="135" width="1000" height="530" rx="12"/><text class="small" x="42" y="160">工具包服务端 · Linux / WSL</text><rect class="box a" x="220" y="180" width="600" height="70" rx="9"/><text class="head" x="520.0" y="209" text-anchor="middle">统一接口契约</text><text class="small" x="520.0" y="235" text-anchor="middle">tools.py 注册表 + 参数说明 / adapters.py 校验与调用</text><path class="edge" d="M262,104 V173"/><text class="small" x="262" y="143" text-anchor="middle">标准 MCP / HTTP</text><path class="edge" d="M778,104 V173"/><text class="small" x="778" y="143" text-anchor="middle">本地函数调用</text><rect class="box " x="45" y="300" width="300" height="94" rx="9"/><text class="head" x="195.0" y="329" text-anchor="middle">模型与输入</text><text class="small" x="195.0" y="355" text-anchor="middle">导入 / 组合建模 / 参数副本</text><text class="small" x="195.0" y="378" text-anchor="middle">预览、语义与可选引擎校核</text><rect class="box " x="370" y="300" width="300" height="94" rx="9"/><text class="head" x="520.0" y="329" text-anchor="middle">作业与扫描</text><text class="small" x="520.0" y="355" text-anchor="middle">命名、快照、状态、取消</text><text class="small" x="520.0" y="378" text-anchor="middle">持久记录 + 独立本地执行</text><rect class="box " x="695" y="300" width="300" height="94" rx="9"/><text class="head" x="845.0" y="329" text-anchor="middle">结果与辅助</text><text class="small" x="845.0" y="355" text-anchor="middle">读取、图表、报告、资料检索</text><text class="small" x="845.0" y="378" text-anchor="middle">有限诊断与确认式修复</text><path class="edge" d="M520,250 V276 H195 V294"/><path class="edge" d="M520,250 V276 H520 V294"/><path class="edge" d="M520,250 V276 H845 V294"/><rect class="box b" x="45" y="445" width="300" height="90" rx="9"/><text class="head" x="195.0" y="474" text-anchor="middle">短时 OpenMC Python 进程</text><text class="small" x="195.0" y="500" text-anchor="middle">api() → openmc_worker.py</text><text class="small" x="195.0" y="523" text-anchor="middle">建模、解析、读取与绘图</text><rect class="box b" x="370" y="445" width="300" height="90" rx="9"/><text class="head" x="520.0" y="474" text-anchor="middle">独立作业工作进程</text><text class="small" x="520.0" y="500" text-anchor="middle">run_worker() → OpenMC 可执行</text><text class="small" x="520.0" y="523" text-anchor="middle">长计算脱离一次 MCP 请求</text><rect class="box c" x="695" y="445" width="300" height="90" rx="9"/><text class="head" x="845.0" y="474" text-anchor="middle">可选 CAD / Office 进程</text><text class="small" x="845.0" y="500" text-anchor="middle">CAD 转网格 / 文档格式转换</text><text class="small" x="845.0" y="523" text-anchor="middle">按部署配置选择独立环境</text><path d="M195,419 H845" fill="none" stroke="#77d7c6" stroke-width="1.6"/><path d="M195,394 V419" fill="none" stroke="#77d7c6" stroke-width="1.6"/><path class="edge" d="M195,419 V439"/><path d="M520,394 V419" fill="none" stroke="#77d7c6" stroke-width="1.6"/><path class="edge" d="M520,419 V439"/><path d="M845,394 V419" fill="none" stroke="#77d7c6" stroke-width="1.6"/><path class="edge" d="M845,419 V439"/><rect class="box a" x="45" y="582" width="950" height="65" rx="9"/><text class="head" x="520.0" y="611" text-anchor="middle">服务端 workspace</text><text class="small" x="520.0" y="637" text-anchor="middle">输入及依赖 · .mc-jobs / .mc-scans · 日志 · StatePoint · CSV/JSON · 图与报告</text><path class="edge" d="M195,535 V576"/><path class="edge" d="M520,535 V576"/><path class="edge" d="M845,535 V576"/></svg>