name: verify

on:
  push:
  pull_request:

jobs:
  tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装依赖
        # NumPy is a test dependency for the mesh regression, not an interface runtime dependency.
        run: python -m pip install --disable-pip-version-check -r mcp/requirements.txt numpy==2.5.4
      - name: 业务与 MCP 测试
        run: python scripts/mcp_test_session.py -- python -m unittest discover -s tests -p 'test_*.py' -v
      - name: 可安装包与命令行入口
        run: |
          python -m pip install --disable-pip-version-check --no-deps .
          python mcp/cli.py list > /tmp/source-tools.json
          mc-agent-tools list > /tmp/tools.json
          python -c "import json;d=json.load(open('/tmp/tools.json'));s=json.load(open('/tmp/source-tools.json'));assert d['tools']==s['tools'],'installed tool schemas differ from source';print('installed/source schemas match:',len(d['tools']))"
